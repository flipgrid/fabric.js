name: Node.js Package

on:
  release:
    branches:
      - master
      - 5.x
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 18.x
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - run: npm run build
      - run: node publish.js
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
          PRE_RELEASE: ${{github.event.release.prerelease}}
  update-bug-report:
    runs-on: ubuntu-latest
    # wait for publishing to complete
    needs: publish-npm
    if: always()
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          ref: master
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 18.x
      - run: npm ci
      - name: Latest major version for bug report update
        id: major
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          result-encoding: string
          script: |
            const fs = require('fs-extra');
            const semver = require('semver');
            const { version } = fs.readJsonSync('./package.json');
            return semver.major(version);
      - name: Update bug report version
        uses: ShaMan123/gha-populate-form-version@396562792037c056c35958b3e5239ddee898154c # v2.0.1
        with:
          semver: '>=4.0.0 || >=${{ steps.major.outputs.result }}.0.0-rc || >=${{ steps.major.outputs.result }}.0.0-beta'
          dry_run: no-push
      - name: Update bug report node version
        uses: ShaMan123/gha-populate-form-version@396562792037c056c35958b3e5239ddee898154c # v2.0.1
        with:
          dropdown: _node_version
          package: node
          semver: '>=14.0.0'
          dry_run: no-push
      - name: Commit & PR
        uses: peter-evans/create-pull-request@671dc9c9e0c2d73f07fa45a3eb0220e1622f0c5f # v4.1.3
        with:
          add-paths: .github/ISSUE_TEMPLATE/bug_report.yml
          branch: ci-update-bug-report
          base: master
          delete-branch: true
          labels: CI/CD, bot, task
          title: 'chore(): Update bug report'
          body: |
            Automated update to `.github/ISSUE_TEMPLATE/bug_report.yml`
            Triggered by job [`${{ github.job }}`](../actions/runs/${{ github.run_id }})
